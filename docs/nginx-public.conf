# nginx in front of the public site (docs/adr/0008-public-read-only-site.md). Replace
# stats.example.org and the certificate paths; the public container listens on 127.0.0.1:3001
# (N4_PUBLIC_PORT in docker-compose.yml). The room's server (port 3000) is never proxied here.

limit_req_zone $binary_remote_addr zone=n4_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=n4_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name stats.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stats.example.org;

    ssl_certificate     /etc/letsencrypt/live/stats.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.example.org/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 4k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Makes the login cookie Secure.
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/public/login {
        limit_req zone=n4_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
    }

    location /api/ {
        limit_req zone=n4_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
